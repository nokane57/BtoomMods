# This is the mods.toml file. It contains the data related to loading your mod.
# Ce fichier mods.toml contient les informations liées au chargement du mod.
# Format TOML standard v0.5.0 — Plus d’informations : https://github.com/toml-lang/toml

# Type of mod loader — for Forge mods, this should be "javafml"
# Type de chargeur de mod — pour les mods Forge, utilisez "javafml"
modLoader = "javafml" #mandatory

# The version range of the loader (Forge version range)
# La plage de version du chargeur (version de Forge)
loaderVersion = "${loader_version_range}" #mandatory

# The license for your mod — important for distribution
# La licence du mod — importante pour la distribution
license = "${mod_license}"

# Optional issue tracker URL
# Lien optionnel vers le suivi des problèmes
#issueTrackerURL = "https://change.me.to.your.issue.tracker.example.invalid/"

# ----- Mod Information -----
[[mods]] #mandatory

# The mod ID (must match the @Mod annotation in your main class)
# L’identifiant unique du mod (doit correspondre à l’annotation @Mod)
modId = "${mod_id}" #mandatory

# The version of your mod
# La version du mod
version = "${mod_version}" #mandatory

# The displayed name of the mod
# Le nom affiché du mod
displayName = "${mod_name}" #mandatory

# Optional links and metadata
# Liens et métadonnées optionnels
#updateJSONURL = "https://change.me.example.invalid/updates.json"
#displayURL = "https://change.me.to.your.mods.homepage.example.invalid/"
logoFile = "btoommods.png" #optional

# Credits (shown in the mod list)
# Crédits (affichés dans la liste des mods)
credits = "Merci à Nokane_57 pour le développement du mod. / Thanks to Nokane_57 for developing the mod." #optional

# Authors (shown in the mod list)
# Auteurs (affichés dans la liste des mods)
authors = "${mod_authors}" #optional

# Description of the mod (multi-line)
# Description du mod (plusieurs lignes possibles)
description = '''
${mod_description}
'''

# ----- Dependencies -----

# Forge dependency
[[dependencies."${mod_id}"]] #mandatory
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

# Minecraft dependency
[[dependencies."${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
